---
- name: Deploiement industriel de l'agent Zabbix sur Windows
  hosts: windows_servers
  gather_facts: no
  serial: 30 # Traite les 200 serveurs par lots de 30 pour préserver le réseau
  vars:
    # CONFIGURATION ZABBIX : Modifiez ces valeurs selon votre infrastructure
    zabbix_server_ip: "192.168.100.135"
    zabbix_version: "6.0"
    zabbix_msi_url: "https://zabbix.com"

  tasks:
    - name: 1. Creer le dossier temporaire pour l'installeur
      ansible.windows.win_file:
        path: C:\Temp\Zabbix
        state: directory

    - name: 2. Telecharger l'agent Zabbix (.msi)
      ansible.windows.win_get_url:
        url: "{{ zabbix_msi_url }}"
        dest: C:\Temp\Zabbix\zabbix_agent.msi
        timeout: 60

    - name: 3. Executer l'installation silencieuse du MSI
      ansible.windows.win_package:
        path: C:\Temp\Zabbix\zabbix_agent.msi
        arguments: >
          /qn
          SERVER={{ zabbix_server_ip }}
          SERVERACTIVE={{ zabbix_server_ip }}
          HOSTNAME={{ inventory_hostname }}
          ENABLEPATH=1
        state: present

    - name: 4. Autoriser le port Zabbix (10050) dans le pare-feu Windows
      community.windows.win_firewall_rule:
        name: "Zabbix Agent Monitoring"
        localport: 10050
        action: allow
        direction: in
        protocol: tcp
        state: present

    - name: 5. Nettoyer le fichier d'installation
      ansible.windows.win_file:
        path: C:\Temp\Zabbix\zabbix_agent.msi
        state: absent
