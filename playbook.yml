---
- name: Gestion des correctifs via WSUS local
  hosts: windows_servers
  gather_facts: no
  vars:
    # Remplacez par l'URL et le port de votre serveur WSUS (ex: 8530 pour HTTP, 8531 pour HTTPS)
    wsus_server_url: "http://priwsus001.local:8530"

  tasks:
    - name: 1. Configurer le serveur WSUS dans le registre Windows
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
        name: "{{ item.key }}"
        data: "{{ item.value }}"
        type: dword
      loop:
        - { key: 'ElevateNonAdmins', value: 1 }
        - { key: 'WUServer', value: "{{ wsus_server_url }}" }
        - { key: 'WUStatusServer', value: "{{ wsus_server_url }}" }
      # Note : Pour les versions anciennes comme 2008, l'URL doit être une chaîne (string). 
      # Les types dword ci-dessus activent la stratégie globale.

    - name: 2. Forcer l'utilisation de WSUS (UseWUServer = 1)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: UseWUServer
        data: 1
        type: dword

    - name: 3. Redémarrer le service Windows Update pour appliquer les changements
      ansible.windows.win_service:
        name: wuauserv
        state: restarted

    - name: 4. Rechercher et installer uniquement les patchs approuvés sur le WSUS
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        # 'server_selection: managed' force explicitement l'usage du serveur WSUS de l'entreprise
        server_selection: managed
        reboot: yes
        reboot_timeout: 3600
      register: update_result

    - name: 5. Rapport d'exécution
      ansible.builtin.debug:
        msg: "Mise a jour terminee via WSUS. Patchs installes : {{ update_result.found_update_count }}"
